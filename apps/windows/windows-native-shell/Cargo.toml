[package]
name = "abridge-windows-shell"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
build = "build.rs"

[[bin]]
name = "aBridge"
path = "src/main.rs"

[dependencies]
naui-winui3 = { version = "=0.15.0", features = ["self-contained"] }
naui-windows = { version = "=0.15.0", features = ["self-contained"] }
naui-core = "=0.15.0"
windows = { version = "0.62", features = ["Foundation", "Win32_Foundation"] }
windows-core = "0.62"
serde_json = "1"
sha2 = "0.10"
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security", "Win32_Storage_FileSystem"] }

[build-dependencies]
serde_json = "1"
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"




